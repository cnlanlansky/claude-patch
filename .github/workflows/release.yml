name: 发布

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: 验证、构建并发布 Windows x64
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 运行测试
        shell: pwsh
        run: go test ./... -timeout=90s

      - name: 运行静态检查
        shell: pwsh
        run: go vet ./...

      - name: 构建正式程序
        shell: pwsh
        env:
          CLAUDE_PATCH_VERSION: ${{ github.ref_name }}
        run: .\scripts\build.ps1

      - name: 打包并创建 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Tag 必须符合 vX.Y.Z：$tag"
          }

          $archive = "dist\claude-patch-$tag-windows-x64.zip"
          $checksum = "$archive.sha256"
          Compress-Archive `
            -LiteralPath 'dist\claude-patch.exe' `
            -DestinationPath $archive `
            -CompressionLevel Optimal

          $hash = (Get-FileHash `
            -LiteralPath $archive `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" |
            Set-Content -LiteralPath $checksum -Encoding ascii

          @(
            "Claude Patch $tag"
            ''
            '- Windows x64'
            '- 仅适配 Claude Code v2.1.233'
            '- 解压后运行 `claude-patch.exe`'
          ) | Set-Content -LiteralPath 'release-notes.md' -Encoding utf8

          gh release create $tag `
            $archive `
            $checksum `
            --verify-tag `
            --title $tag `
            --notes-file 'release-notes.md'
